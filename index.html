<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovi Piani!</title>
    <style>
        /* Impostazioni generali della pagina */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe4e1;
            font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
            transition: background-color 0.8s ease;
        }

        /* Contenitore centrale stondato */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            z-index: 10;
            max-width: 600px;
            width: 90%;
            box-sizing: border-box;
            position: relative;
        }

        /* Gestione dei passaggi */
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #000000;
            font-size: 26px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        
        p.subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        /* Area e stile dei bottoni base */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            min-height: 60px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px; 
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-next {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.2);
        }
        .btn-next:hover { transform: scale(1.05); }

        /* Bottoni per la selezione delle date */
        .btn-option {
            background-color: #f1f2f6;
            color: #2f3542;
            font-size: 16px;
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-option:hover { background-color: #dfe4ea; transform: translateY(-2px); }
        .btn-option.selected {
            background-color: #1e90ff;
            color: white;
            border-color: #0c2461;
            box-shadow: 0 4px 10px rgba(30, 144, 255, 0.3);
        }

        /* Campi di input extra */
        input[type="text"] {
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #ccc;
            font-size: 16px;
            font-family: inherit;
            width: 80%;
            max-width: 300px;
            margin-top: 15px;
            text-align: center;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #1e90ff;
        }

        /* ----- STILE DELLE CARTE 3D (VERE CARTE DA GIOCO) ----- */
        .cards-container {
            display: flex;
            flex-direction: row; /* Carte affiancate */
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            width: 150px;
            height: 210px; /* Proporzioni perfette per carte da gioco */
            perspective: 1000px; 
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 12px;
        }

        .card-inner.flipped {
            transform: rotateY(180deg); /* Ruota lateralmente come una vera carta */
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            background-color: white; /* Il bordo bianco tipico delle carte reali
